<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il Narratore</title>
<meta name="description" content="Il Narratore: giochi da raccontare (Lupus in Fabula, Mister White, La Spia) con un telefono solo o uno a testa.">
<meta name="theme-color" content="#0e1320">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Narratore">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=Pirata+One&family=Titan+One&family=Special+Elite&family=Cinzel:wght@600&family=Racing+Sans+One&family=Fredoka:wght@600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout: colonna unica da telefono, scena illustrata in alto, un'azione principale in basso. Tre "pelli" (classico, palude, horror) cambiano solo token. */
:root{
  --bg:#e4e8ee;--surface:#f4f6f9;--surface2:#dde3ec;--fg:#1a2233;--muted:#55627a;--line:#c5cddb;
  --accent:#3f5fa8;--accent-fg:#fff;--gold:#a8700c;--gold-fg:#fff;--danger:#a8362f;
  --font-display:'Pirata One',Georgia,'Times New Roman',serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --accent-soft:color-mix(in srgb,var(--accent) 15%,var(--surface));
  --accent-ledge:color-mix(in srgb,var(--accent) 62%,#000);
  --accent-text:color-mix(in srgb,var(--accent) 70%,var(--fg));
  --gold-bg:color-mix(in srgb,var(--gold) 16%,var(--surface));
  --gold-ledge:color-mix(in srgb,var(--gold) 62%,#000);
  --gold-text:color-mix(in srgb,var(--gold) 55%,var(--fg));
  --danger-bg:color-mix(in srgb,var(--danger) 14%,var(--surface));
  --shade:rgba(8,10,6,.62);
}
:root[data-skin="palude"]{
  --bg:#e6ebd3;--surface:#f4f7e6;--surface2:#dce4c0;--fg:#1b2715;--muted:#53643f;--line:#c4cf9f;
  --accent:#477f19;--accent-fg:#fff;--gold:#a97a0c;--gold-fg:#fff;--danger:#a63a28;
  --font-display:'Titan One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
}
:root[data-skin="principesse"]{--bg:#f8e8f1;--surface:#fff5fa;--surface2:#f0d6e6;--fg:#3a1f33;--muted:#7a5a70;--line:#e6c3d8;--accent:#b4408f;--accent-fg:#fff;--gold:#a97a1c;--gold-fg:#fff;--danger:#b0323f;--font-display:'Playfair Display',Georgia,serif}
:root[data-skin="potter"]{--bg:#ece3d0;--surface:#f7f0de;--surface2:#e0d3b5;--fg:#2a2112;--muted:#6a5a3a;--line:#cdbf9a;--accent:#8a1f2e;--accent-fg:#fff;--gold:#9a7210;--gold-fg:#fff;--danger:#a3201f;--font-display:'Cinzel',Georgia,serif}
:root[data-skin="f1"]{--bg:#e8e8ea;--surface:#f6f6f7;--surface2:#d9dadd;--fg:#15151e;--muted:#5a5b66;--line:#c4c5cc;--accent:#d6101f;--accent-fg:#fff;--gold:#a87000;--gold-fg:#fff;--danger:#d6101f;--font-display:'Racing Sans One','Arial Black',Impact,sans-serif}
:root[data-skin="pokemon"]{--bg:#e8f0fb;--surface:#f6f9ff;--surface2:#d3e1f5;--fg:#14243d;--muted:#4f6585;--line:#bccde6;--accent:#d0312d;--accent-fg:#fff;--gold:#a07a00;--gold-fg:#fff;--danger:#c0302b;--font-display:'Fredoka','Trebuchet MS',system-ui,sans-serif}
:root[data-skin="horror"]{
  --bg:#e9e2dd;--surface:#f6f1ed;--surface2:#ddd2ca;--fg:#1d1412;--muted:#6b5a53;--line:#cfc0b6;
  --accent:#b8420f;--accent-fg:#fff;--gold:#8f6f00;--gold-fg:#fff;--danger:#a3151f;
  --font-display:'Special Elite','Courier New',Courier,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1320;--surface:#171f33;--surface2:#212b45;--fg:#e4e9f5;--muted:#94a1be;--line:#2b3654;
    --accent:#8aa7f0;--accent-fg:#0b1020;--gold:#e0b34a;--gold-fg:#1a1204;--danger:#ec7d72;color-scheme:dark}
  :root[data-skin="palude"]:not([data-theme="light"]){
    --bg:#0f150b;--surface:#19230f;--surface2:#243318;--fg:#e5ecd0;--muted:#98a885;--line:#2c3c1f;
    --accent:#9ccf4c;--accent-fg:#10190a;--gold:#e3b948;--gold-fg:#1a1404;--danger:#e47562;color-scheme:dark}
  :root[data-skin="principesse"]:not([data-theme="light"]){--bg:#1a0f1d;--surface:#2a1830;--surface2:#3a2342;--fg:#f6e6f2;--muted:#b99ab0;--line:#4a2c52;--accent:#f08ccf;--accent-fg:#10101a;--gold:#f2cf6a;--gold-fg:#1a1204;--danger:#f07a8a;color-scheme:dark}
  :root[data-skin="potter"]:not([data-theme="light"]){--bg:#0d0b12;--surface:#171421;--surface2:#231e32;--fg:#efe6d0;--muted:#a89c82;--line:#332c46;--accent:#e0b34a;--accent-fg:#10101a;--gold:#e8c768;--gold-fg:#1a1204;--danger:#ec6b6b;color-scheme:dark}
  :root[data-skin="f1"]:not([data-theme="light"]){--bg:#0b0b10;--surface:#16161f;--surface2:#22222e;--fg:#f1f1f4;--muted:#9a9bab;--line:#2e2e3d;--accent:#ff3b47;--accent-fg:#10101a;--gold:#ffc233;--gold-fg:#1a1204;--danger:#ff5b5b;color-scheme:dark}
  :root[data-skin="pokemon"]:not([data-theme="light"]){--bg:#0d1424;--surface:#172238;--surface2:#213150;--fg:#e8f0ff;--muted:#92a6c8;--line:#2b3d60;--accent:#ff6a5f;--accent-fg:#10101a;--gold:#ffd23f;--gold-fg:#1a1204;--danger:#ff7a70;color-scheme:dark}
  :root[data-skin="horror"]:not([data-theme="light"]){
    --bg:#0b0808;--surface:#181111;--surface2:#271a18;--fg:#f0e4da;--muted:#a69187;--line:#33231f;
    --accent:#ff7a1f;--accent-fg:#1a0b02;--gold:#e8c52c;--gold-fg:#1a1500;--danger:#ff5b4f;color-scheme:dark}
}
:root[data-theme="dark"]{
  --bg:#0e1320;--surface:#171f33;--surface2:#212b45;--fg:#e4e9f5;--muted:#94a1be;--line:#2b3654;
  --accent:#8aa7f0;--accent-fg:#0b1020;--gold:#e0b34a;--gold-fg:#1a1204;--danger:#ec7d72;color-scheme:dark}
:root[data-theme="dark"][data-skin="palude"]{
  --bg:#0f150b;--surface:#19230f;--surface2:#243318;--fg:#e5ecd0;--muted:#98a885;--line:#2c3c1f;
  --accent:#9ccf4c;--accent-fg:#10190a;--gold:#e3b948;--gold-fg:#1a1404;--danger:#e47562}
:root[data-theme="dark"][data-skin="principesse"]{--bg:#1a0f1d;--surface:#2a1830;--surface2:#3a2342;--fg:#f6e6f2;--muted:#b99ab0;--line:#4a2c52;--accent:#f08ccf;--accent-fg:#10101a;--gold:#f2cf6a;--gold-fg:#1a1204;--danger:#f07a8a}
:root[data-theme="dark"][data-skin="potter"]{--bg:#0d0b12;--surface:#171421;--surface2:#231e32;--fg:#efe6d0;--muted:#a89c82;--line:#332c46;--accent:#e0b34a;--accent-fg:#10101a;--gold:#e8c768;--gold-fg:#1a1204;--danger:#ec6b6b}
:root[data-theme="dark"][data-skin="f1"]{--bg:#0b0b10;--surface:#16161f;--surface2:#22222e;--fg:#f1f1f4;--muted:#9a9bab;--line:#2e2e3d;--accent:#ff3b47;--accent-fg:#10101a;--gold:#ffc233;--gold-fg:#1a1204;--danger:#ff5b5b}
:root[data-theme="dark"][data-skin="pokemon"]{--bg:#0d1424;--surface:#172238;--surface2:#213150;--fg:#e8f0ff;--muted:#92a6c8;--line:#2b3d60;--accent:#ff6a5f;--accent-fg:#10101a;--gold:#ffd23f;--gold-fg:#1a1204;--danger:#ff7a70}
:root[data-theme="dark"][data-skin="horror"]{
  --bg:#0b0808;--surface:#181111;--surface2:#271a18;--fg:#f0e4da;--muted:#a69187;--line:#33231f;
  --accent:#ff7a1f;--accent-fg:#1a0b02;--gold:#e8c52c;--gold-fg:#1a1500;--danger:#ff5b4f}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:540px;margin:0 auto;padding-block:8px 36px}
.muted{color:var(--muted)}
.mt14{margin:14px 0}.mt20{margin-top:20px}.mb6{margin:0 0 6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand>svg{width:36px;height:36px;color:var(--accent);flex:none;stroke-width:1.7}
.brand small{display:block;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
.brand b{display:block;font:400 1.35rem/1.05 var(--font-display);letter-spacing:.01em}
.topr{display:flex;align-items:center;gap:8px;flex:none}
.chip{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--surface2);color:var(--fg);white-space:nowrap}
.chip.bad{background:var(--danger-bg);color:var(--danger)}
.icn{width:44px;height:44px;border-radius:12px;border:0;background:var(--surface2);display:grid;place-items:center;cursor:pointer}
.icn svg{width:22px;height:22px}
.scene{border-radius:18px;overflow:hidden;margin:6px 0 16px;border:1.5px solid var(--line)}
.scene svg{display:block;width:100%;height:92px}
.ff{animation:ff 3.2s ease-in-out infinite}
.ff:nth-of-type(2n){animation-delay:-1.4s}
@keyframes ff{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.ff{animation:none}}
.h1{font:400 1.9rem/1.1 var(--font-display);text-wrap:balance;margin-bottom:8px}
.lead{color:var(--muted);margin-bottom:18px;text-wrap:pretty}
.blk{margin-top:22px}
.blkh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.blkh h2{font:400 1.25rem/1.1 var(--font-display)}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 18px;border:0;border-radius:14px;background:var(--surface2);color:var(--fg);font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.btn svg{width:20px;height:20px;flex:none}
.btn:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.pri{background:var(--accent);color:var(--accent-fg);box-shadow:0 4px 0 var(--accent-ledge)}
.btn.gold{background:var(--gold);color:var(--gold-fg);box-shadow:0 4px 0 var(--gold-ledge)}
.btn.bad{background:var(--danger);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--danger) 60%,#000)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.lnk{background:none;border:0;padding:0;color:var(--accent-text);font-weight:700;text-decoration:underline;cursor:pointer}
.skins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.skin{display:flex;flex-direction:column;gap:6px;text-align:left;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;min-width:0}
.skin b{font-size:.98rem}
.skin small{color:var(--muted);font-size:.74rem;line-height:1.25}
.skin[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sw{display:flex;height:22px;border-radius:7px;overflow:hidden}
.sw i{flex:1}
.sw i:nth-child(1){background:var(--s1)}.sw i:nth-child(2){background:var(--s2)}.sw i:nth-child(3){background:var(--s3)}
.skin[data-k="classico"]{--s1:#0e1320;--s2:#8aa7f0;--s3:#e0b34a}
.skin[data-k="palude"]{--s1:#19230f;--s2:#9ccf4c;--s3:#e3b948}
.skin[data-k="principesse"]{--s1:#2a1830;--s2:#f08ccf;--s3:#f2cf6a}
.skin[data-k="potter"]{--s1:#171421;--s2:#e0b34a;--s3:#8a1f2e}
.skin[data-k="f1"]{--s1:#16161f;--s2:#ff3b47;--s3:#ffc233}
.skin[data-k="pokemon"]{--s1:#172238;--s2:#ff6a5f;--s3:#3b6fd8}
.skin[data-k="horror"]{--s1:#181111;--s2:#ff7a1f;--s3:#a3151f}
.add{display:flex;gap:8px;margin-bottom:10px}
.add input,.field{flex:1;min-width:0;height:48px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:0 14px}
.add input:focus,.field:focus{border-color:var(--accent);outline:0}
.field.codein{text-align:center;font:400 2rem/1 var(--font-display);letter-spacing:.25em;text-transform:uppercase;height:64px}
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);min-height:50px}
.row .nm{font-weight:700;overflow-wrap:anywhere;min-width:0;display:flex;align-items:center;gap:8px}
.row.dead .nm{text-decoration:line-through;color:var(--muted)}
.row .rx{display:flex;align-items:center;gap:8px;flex:none}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.dot.on{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.x{width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.x svg{width:18px;height:18px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{min-width:1.6em;text-align:center;font-size:1.25rem;font-variant-numeric:tabular-nums}
.stepper .btn{min-height:40px;padding:6px 14px}
.opt{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt .oi{width:34px;height:34px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;flex:none}
.opt .oi svg{width:20px;height:20px}
.opt .ot{flex:1;min-width:0}
.opt .ot b{display:block}
.opt .ot small{display:block;color:var(--muted);line-height:1.3}
.sws{position:relative;width:50px;height:30px;flex:none}
.sws input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:1}
.sws span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.sws span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sws input:checked+span{background:var(--accent)}
.sws input:checked+span::after{transform:translateX(20px)}
.sws input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.tag{display:inline-flex;align-items:center;gap:5px;width:fit-content;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px 3px 6px;border-radius:999px;white-space:nowrap}
.tag svg{width:13px;height:13px}
.tag.lupi{background:var(--danger-bg);color:var(--danger)}
.tag.vill{background:var(--accent-soft);color:var(--accent-text)}
.tag.spec{background:var(--gold-bg);color:var(--gold-text)}
select.rs{height:42px;border-radius:12px;border:2px solid var(--line);background:var(--surface);padding:0 10px;max-width:11.5rem}
.warn{background:var(--danger-bg);color:var(--danger);border-radius:12px;padding:10px 12px;font-weight:700;margin-top:12px}
.hint{color:var(--muted);font-size:.9rem;margin-top:8px}
.pips{display:flex;gap:6px;margin:2px 0 14px}
.pips i{height:6px;flex:1;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--accent)}
.kick{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stept{font:400 1.7rem/1.1 var(--font-display);margin:2px 0 12px;display:flex;align-items:center;gap:10px}
.stept svg{width:28px;height:28px;color:var(--gold);flex:none}
.say{position:relative;background:var(--gold-bg);color:var(--gold-text);border-radius:16px;padding:12px 14px;margin-bottom:18px;font-style:italic;text-wrap:pretty}
.say::after{content:"";position:absolute;left:24px;bottom:-9px;width:16px;height:16px;background:var(--gold-bg);transform:rotate(45deg);border-radius:0 0 4px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pl{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:7px;text-align:left;min-height:72px;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;min-width:0}
.pl .nm{font-weight:700;overflow-wrap:anywhere;padding-right:22px}
.pl[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pl.wolf[aria-pressed="true"]{border-color:var(--danger);background:var(--danger-bg)}
.pl[disabled]{opacity:.42;cursor:not-allowed}
.pl .mk{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.pl.wolf .mk{background:var(--danger);color:#fff}
.pl .mk svg{width:14px;height:14px;stroke-width:3}
.res{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border-radius:14px;font-weight:700}
.res svg{width:22px;height:22px;flex:none}
.res.yes{background:var(--danger-bg);color:var(--danger)}
.res.no{background:var(--accent-soft);color:var(--accent-text)}
.bar{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.bar .btn{flex:1}
.bar .btn:first-child:not(.pri):not(.gold):not(.bad){flex:0 0 auto}
.dead-note{display:flex;gap:10px;align-items:flex-start}
.dead-note svg{width:24px;height:24px;flex:none;color:var(--muted)}
.big{font:400 2rem/1.1 var(--font-display);text-wrap:balance}
.deaths{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.death{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;border-radius:14px;background:var(--danger-bg)}
.death b{font-size:1.15rem;overflow-wrap:anywhere}
.death small{display:block;color:var(--muted)}
.calm{padding:16px;border-radius:14px;background:var(--accent-soft);color:var(--accent-text);font-weight:700;margin:14px 0}
.spell{padding:14px;border-radius:14px;background:var(--gold-bg);color:var(--gold-text);font-weight:700;margin:14px 0;display:flex;gap:10px;align-items:center}
.spell svg{width:22px;height:22px;flex:none}
.recap li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.recap li:last-child{border-bottom:0}
.recap li svg{width:20px;height:20px;flex:none;margin-top:1px;color:var(--gold)}
.stats{display:flex;gap:16px;color:var(--muted);font-weight:700;margin-bottom:6px;font-variant-numeric:tabular-nums}
.banner{padding:20px 16px;border-radius:18px;margin-bottom:16px}
.banner.lupi{background:var(--danger-bg);color:var(--danger)}
.banner.vill{background:var(--accent-soft);color:var(--accent-text)}
.banner.amanti{background:var(--gold-bg);color:var(--gold-text)}
.banner p{margin-top:6px;color:var(--fg)}
.log{margin-top:6px}
.log h3{font:400 1.1rem/1.1 var(--font-display);margin:16px 0 4px}
.log li{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.log li.s{color:var(--muted)}
.log li .sec{flex:none;font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 6px;border-radius:6px;background:var(--surface2);margin-top:2px}

.ov{position:fixed;inset:0;z-index:50}

var CAPS={has:!!(window.claude&&window.claude.use),db:null,room:null,ready:false,ps:null};

  if(!CAPS.has){CAPS.ready=true;return Promise.resolve(CAPS);}

  return CAPS.ps;
};
SERATA.reset=function(id){var o=document.getElementById(id),n=o.cloneNode(false);o.parentNode.replaceChild(n,o);return n;};
SERATA.mkSync=function(onErr){
  var q=Promise.resolve(),cache={},bad=false;
  return {run:function(code,pub,cards){
    if(!CAPS.db)return;var t=[];
    Object.keys(cards||{}).forEach(function(id){var c=JSON.stringify(cards[id]);if(cache['c'+code+id]!==c){cache['c'+code+id]=c;t.push(function(){return CAPS.db.doc('rooms/'+code+'/cards/p'+id).set(JSON.parse(c));});}});
    var p=JSON.stringify(pub);if(cache['p'+code]!==p){cache['p'+code]=p;t.push(function(){return CAPS.db.doc('rooms/'+code).set(JSON.parse(p));});}
    t.forEach(function(f){q=q.then(f).then(function(){if(bad){bad=false;onErr(false);}}).catch(function(){if(!bad){bad=true;onErr(true);}});});
  },reset:function(){cache={};}};
};
SERATA.peers=function(code,cb){
  var h={r:null,dead:false};
  if(CAPS.room)CAPS.room.join('serata-'+code.toLowerCase()).then(function(r){
    if(h.dead){try{r.leave();}catch(e){}return;}
    h.r=r;r.onPeers(function(ch){cb(ch.peers.map(function(p){return p.presence||{};}));});
  }).catch(function(){});
  h.leave=function(){h.dead=true;if(h.r){try{h.r.leave();}catch(e){}h.r=null;}};
  return h;
};
SERATA.presence=function(code){
  var h={r:null,dead:false,pend:null};
  if(CAPS.room)CAPS.room.join('serata-'+code.toLowerCase()).then(function(r){
    if(h.dead){try{r.leave();}catch(e){}return;}
    h.r=r;if(h.pend)try{r.presence(h.pend);}catch(e){}
  }).catch(function(){});
  h.set=function(p){h.pend=p;if(h.r)try{h.r.presence(p);}catch(e){}};
  h.leave=function(){h.dead=true;if(h.r){try{h.r.leave();}catch(e){}h.r=null;}};
  return h;
};

};
SERATA.askHome=function(){
  var b=document.getElementById('homeb');

  b.classList.add('arm');b.innerHTML=SERATA.u.ico('grid',18)+'<span>'+SERATA.tr('Tocca ancora per uscire')+'</span>';
  clearTimeout(SERATA.hT);SERATA.hT=setTimeout(function(){SERATA.homeBtn();},3500);
};
SERATA.homeBtn=function(){
  var b=document.getElementById('homeb');
  if(!SERATA.cur){if(b)b.remove();return;}

SERATA.lang=(function(){try{return localStorage.getItem('serata-lang')==='en'?'en':'it';}catch(e){return 'it';}})();
(function(){
  var E=null,subs=null,rxs=null,NR=null,cache={};
  var MAN=[
   [/^Rimuovi (.+)$/,'Remove $1'],[/^Ruolo di (.+)$/,'Role of $1'],
   [/^Notte (\d+)$/,'Night $1'],[/^Giorno (\d+)$/,'Day $1'],

    if(SERATA.lang!=='en'||!root)return;
    if(root.nodeType===3){var p=root.parentNode;if(p&&!/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName)){var v=tr(root.nodeValue);if(v!==root.nodeValue)root.nodeValue=v;}return;}

    SERATA.lang=l==='en'?'en':'it';cache={};
    try{localStorage.setItem('serata-lang',SERATA.lang);}catch(e){}

SERATA.hub=function(){
  var $app=SERATA.reset('app'),$ov=SERATA.reset('ov');$ov.hidden=true;$ov.innerHTML='';
  var T={code:'',msg:'',busy:false},dead=false;
  function view(){
    return '<div class="wrap"><header class="top"><div class="brand">'+ico('dice',36)+'<div><small>Giochi da raccontare</small><b>Il Narratore</b></div></div></header>'
    +'<section class="blk"><div class="blkh"><h2>Impostazioni</h2></div><div class="card"><div class="opt"><div class="ot"><b>Lingua / Language</b></div><div class="stepper"><button class="btn'+(SERATA.lang==='it'?' pri':'')+'" data-a="lang" data-k="it">Italiano</button><button class="btn'+(SERATA.lang==='en'?' pri':'')+'" data-a="lang" data-k="en">English</button></div></div></div></section>'
    +'<h1 class="h1">A cosa giochiamo?</h1><p class="lead">L’app tiene il conto di tutto e racconta ogni fase. Si gioca con un solo telefono, oppure ognuno col suo.</p>'
    +'<div class="modes">'+LIST.map(function(g){return '<button class="mode" data-a="play" data-k="'+g.k+'">'+ico(g.i,30)+'<b>'+esc(g.n)+'</b><small>'+esc(g.t)+'</small><small>'+esc(g.m)+' · un telefono o più telefoni</small></button>';}).join('')+'</div>'
    +'<section class="blk"><div class="blkh"><h2>Hai un codice?</h2></div><div class="card"><p class="muted mb6">Se il Narratore ha scelto «ognuno col suo telefono», scrivi qui il codice di quattro lettere.</p><form data-form="join" class="add"><input id="hubCode" class="field codein" type="text" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD" value="'+esc(T.code)+'"><button class="btn pri" type="submit" '+(T.busy?'disabled':'')+'>Entra</button></form>'+(T.msg?'<p class="warn">'+esc(T.msg)+'</p>':'')+'</div></section></div>';
  }
  function render(){if(dead)return;$app.innerHTML=view();}
  function join(){
    var el=document.getElementById('hubCode'),v=((el&&el.value)||T.code||'').trim().toUpperCase();
    T.code=v;
    if(v.length!==4){T.msg='Il codice ha quattro lettere.';return render();}
    T.busy=true;T.msg='Cerco la stanza…';render();
    SERATA.cap().then(function(c){
      if(dead)return;
      if(!c.db){T.busy=false;T.msg='Per entrare serve aprire il link da collegato a Claude.';return render();}
      c.db.doc('rooms/'+v).get().then(function(s){
        if(dead)return;T.busy=false;
        if(!s||!s.exists){T.msg='Stanza non trovata. Controlla il codice.';return render();}
        var g=(s.data()&&s.data().game)||'lupus';
        if(g==='lupus'){try{localStorage.setItem('lupus-player-v1',JSON.stringify({active:true,code:v,pid:null,want:null}));}catch(e){}SERATA.go('lupus');}
        else SERATA.go(g,{join:v});
      }).catch(function(){T.busy=false;T.msg='Non riesco a raggiungere la stanza.';render();});
    });
  }
  $app.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;if(b.getAttribute('data-a')==='play')SERATA.go(b.getAttribute('data-k'));if(b.getAttribute('data-a')==='lang')SERATA.setLang(b.getAttribute('data-k'));});
  $app.addEventListener('submit',function(e){e.preventDefault();join();});
  $app.addEventListener('input',function(e){if(e.target.id==='hubCode'){e.target.value=e.target.value.toUpperCase();T.code=e.target.value;}});
  render();SERATA.cap();
  return {destroy:function(){dead=true;}};
};

SERATA.party=function(def){
return function(opts){
  opts=opts||{};
  var CAP=CAPS,KEY='serata-'+def.key+'-v1',PKEY='serata-player-v1',DEAD=false;
  function fresh(){return {v:1,mode:null,phase:'setup',players:[],uid:1,seen:{},room:{on:false,code:''},g:def.fresh()};}
  function load(){try{var j=localStorage.getItem(KEY);if(!j)return null;var o=JSON.parse(j);if(!o||o.v!==1)return null;var f=fresh();for(var k in o)f[k]=o[k];return f;}catch(e){return null;}}
  var S=load()||fresh();
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
  var PL=(function(){try{var j=localStorage.getItem(PKEY);if(j){var o=JSON.parse(j);if(o&&o.game===def.key)return o;}}catch(e){}return {game:def.key,active:false,code:'',pid:null,want:null};})();
  if(opts.join){PL={game:def.key,active:true,code:opts.join,pid:null,want:null};}
  function savePL(){try{localStorage.setItem(PKEY,JSON.stringify(PL));}catch(e){}}
  var T={draft:'',err:'',online:{},onlineKey:'',syncErr:false,rev:null,sel:[],nr:null,wantDraft:''};
  var PD={pub:null,card:null,loading:false,slow:false,show:false,u1:null,u2:null,timer:null,cardFor:null,pres:null};
  var $app=SERATA.reset('app'),$ov=SERATA.reset('ov');
  function P(id){return S.players.find(function(p){return p.id===id;});}
  var SY=SERATA.mkSync(function(b){T.syncErr=b;render();});
  function roomOn(){return !!(S.mode==='multi'&&S.room.on&&CAP.db&&S.room.code);}
  var c={S:S,esc:esc,ico:ico,U:SERATA.u,T:T,P:P,commit:function(){commit();},render:function(){render();},alive:function(){return S.players.filter(function(p){return p.alive!==false;});}};
  function sync(){
    if(DEAD||!roomOn())return;
    var pub=def.pub(S)||{};pub.game=def.key;pub.v=1;pub.code=S.room.code;pub.phase=S.phase==='setup'?'lobby':S.phase;pub.title=def.name;
    pub.players=S.players.map(function(p){var b={id:p.id,name:p.name,alive:p.alive!==false},x=def.pubPlayer?def.pubPlayer(S,p):null;if(x)for(var k in x)b[k]=x[k];return b;});
    var cards={};if(S.phase!=='setup')S.players.forEach(function(p){cards[p.id]=def.card(S,p);});
    SY.run(S.room.code,pub,cards);
  }
  function commit(){c.S=S;save();render();sync();}
  /* stanza: lato Narratore */
  function leaveHost(){if(T.nr){T.nr.leave();T.nr=null;}T.online={};T.onlineKey='';}
  function ensureHost(){
    if(DEAD||!CAP.room||!roomOn()||T.nr)return;
    T.nr=SERATA.peers(S.room.code,function(list){
      if(DEAD||PL.active)return;
      var ids={},add=false;
      list.forEach(function(pr){
        if(pr.pid!=null)ids[pr.pid]=1;
        var w=typeof pr.want==='string'?pr.want.trim().slice(0,20):'';
        if(w&&S.phase==='setup'&&S.players.length<24&&!S.players.some(function(x){return x.name.toLowerCase()===w.toLowerCase();})){S.players.push({id:S.uid++,name:w,alive:true});add=true;}
      });
      var k=Object.keys(ids).sort().join(),ch=k!==T.onlineKey;T.onlineKey=k;T.online=ids;
      if(add)commit();else if(ch)render();
    });
  }
  function setRoom(on){leaveHost();SY.reset();if(on){S.room={on:true,code:SERATA.u.newCode()};ensureHost();}else S.room={on:false,code:''};}
  /* stanza: lato giocatore */
  function stopWatch(){
    if(PD.u1){PD.u1();PD.u1=null;}if(PD.u2){PD.u2();PD.u2=null;}
    if(PD.timer){clearTimeout(PD.timer);PD.timer=null;}
    if(PD.pres){PD.pres.leave();PD.pres=null;}
    PD.cardFor=null;PD.pub=null;PD.card=null;
  }
  function pPres(){if(!PL.code)return;if(!PD.pres)PD.pres=SERATA.presence(PL.code);PD.pres.set({want:PL.want||null,pid:PL.pid==null?null:PL.pid});}
  function startWatch(){
    stopWatch();if(!CAP.db||!PL.code)return;
    PD.loading=true;PD.slow=false;PD.timer=setTimeout(function(){if(PD.loading){PD.slow=true;render();}},10000);
    PD.u1=CAP.db.doc('rooms/'+PL.code).onSnapshot(function(s){
      PD.loading=false;PD.slow=false;PD.pub=s.exists?s.data():null;
      if(PD.pub&&PL.pid==null&&PL.want){var m=PD.pub.players.find(function(p){return p.name.toLowerCase()===PL.want.toLowerCase();});if(m){PL.pid=m.id;savePL();}}
      watchCard();if(PL.want||PL.pid!=null)pPres();render();
    },function(){PD.loading=false;PD.slow=true;render();});
  }
  function watchCard(){
    if(PL.pid==null||!PD.pub||PD.cardFor===PL.pid)return;
    if(PD.u2){PD.u2();PD.u2=null;}PD.cardFor=PL.pid;
    PD.u2=CAP.db.doc('rooms/'+PL.code+'/cards/p'+PL.pid).onSnapshot(function(s){PD.card=s.exists?s.data():null;render();},function(){});

  /* ---------- Viste del Narratore ---------- */
  function head(){

  function bMode(){

    +'<button class="mode" data-a="modeSingle">'+ico('phone',30)+'<b>Con il mio telefono</b><small>Un solo telefono. Per mostrare le carte lo passi di mano in mano.</small></button>'
    +'<button class="mode" data-a="modeMulti" '+(dbOk?'':'disabled')+'>'+ico('phones',30)+'<b>Ognuno col suo telefono</b><small>Ogni giocatore vede la propria carta sul suo telefono. Tu ricevi un codice da dare a tutti.</small>'+(dbOk?'':'<em>'+(pending?'Mi sto collegando…':CAP.has?'Non disponibile: apri il link da collegato a Claude.':'Disponibile solo nell’artefatto Claude, non nella versione installata.')+'</em>')+'</button></div>';
  }
  function playersBlock(multi){
    var n=S.players.length,onl=multi&&S.room.on&&CAP.room;
    var list=n?'<ul class="rows">'+S.players.map(function(p){return '<li class="row"><span class="nm">'+(onl?'<i class="dot '+(T.online[p.id]?'on':'')+'"></i>':'')+esc(p.name)+'</span><button class="x" data-a="del" data-id="'+p.id+'" aria-label="Rimuovi '+esc(p.name)+'">'+ico('x')+'</button></li>';}).join('')+'</ul>':'<p class="muted">Ancora nessuno. <button class="lnk" data-a="example">Aggiungi 5 nomi d’esempio</button></p>';
    return '<section class="blk"><div class="blkh"><h2>Chi gioca</h2><span class="muted">'+n+(n===1?' persona':' persone')+'</span></div><form class="add" data-form="add"><input id="newName" type="text" maxlength="20" autocomplete="off" placeholder="Nome del giocatore" value="'+esc(T.draft)+'"><button class="btn pri" type="submit">Aggiungi</button></form>'+(T.err?'<p class="warn">'+esc(T.err)+'</p>':'')+list+'</section>';

  function codeCard(){
    var cnt=0;S.players.forEach(function(p){if(T.online[p.id])cnt++;});

  }
  function bSetup(){
    var multi=S.mode==='multi',prob=def.problem(S);
    return '<h1 class="h1">'+esc(def.name)+'</h1><p class="lead">'+esc(def.lead)+'</p>'+(multi?codeCard():'')+playersBlock(multi)+def.setup(S,c)
    +'<div class="bar"><button class="btn pri block" data-a="deal" '+(prob?'disabled':'')+'>Distribuisci le carte</button></div>'+(prob?'<p class="hint">'+esc(prob)+'</p>':'')
    +'<p class="hint mt20">'+(multi?'Modalità: più telefoni. ':'Modalità: telefono del Narratore. ')+'<button class="lnk" data-a="changeMode">Cambia modalità</button></p>';
  }
  function bCards(){

    return '<h1 class="h1">Carte distribuite</h1><p class="lead">'+(multi?'Chi ha il telefono vede già la sua carta. Per gli altri, tocca «Mostra» e passa il telefono.':'Tocca «Mostra», passa il telefono alla persona, poi nascondi e passa al prossimo.')+'</p><ul class="rows">'
    +S.players.map(function(p){return '<li class="row"><span class="nm">'+(onl?'<i class="dot '+(T.online[p.id]?'on':'')+'"></i>':'')+esc(p.name)+(S.seen[p.id]?' '+ico('check',14):'')+'</span><button class="btn" data-a="revOne" data-id="'+p.id+'">'+ico('eye')+'Mostra</button></li>';}).join('')+'</ul>'
    +'<div class="bar"><button class="btn pri block" data-a="revSeq">'+ico('eye')+'Mostra a ciascuno, in ordine</button></div>'
    +'<div class="bar"><button class="btn" data-a="reshuffle">Rimescola</button><button class="btn pri" data-a="begin">Iniziamo</button></div>'
    +'<p class="hint mt20"><button class="lnk" data-a="backSetup">Torna ai giocatori</button></p>';
  }
  function hostView(){

    if(!S.mode)inner=bMode()+'<p class="hint mt20"><button class="lnk" data-a="hub">← Tutti i giochi</button></p>';

  /* ---------- Viste del giocatore ---------- */
  function pShell(inner){

  }
  function pMsg(title,txt,act,label){return '<h1 class="h1">'+esc(title)+'</h1><p class="lead">'+esc(txt)+'</p>'+(act?'<div class="bar"><button class="btn pri block" data-a="'+act+'">'+esc(label)+'</button></div>':'');}
  function cardBtn(card){
    if(!PD.show)return '<button class="rolecard hid" data-a="pToggle" aria-expanded="false">'+ico('eye',56).replace('<svg ','<svg class="rb" ')+'<span class="big">La tua carta</span><span class="nmx">Tocca per vedere. Controlla che nessuno guardi.</span></button>';

      return pShell('<h1 class="h1">Chi sei?</h1><p class="lead">'+(CAP.room?'Scrivi il tuo nome: il Narratore ti vedrà comparire. Oppure tocca il tuo nome se è già in lista.':'Tocca il tuo nome nella lista del Narratore.')+'</p>'+form+(pub.players.length?'<div class="grid">'+pub.players.map(function(p){return '<button class="pl" data-a="pWho" data-id="'+p.id+'"><span class="nm">'+esc(p.name)+'</span></button>';}).join('')+'</div>':''));
    }

    if(pub.phase==='lobby'||!PD.card)out+=pMsg('Ci sei, '+me.name,'Aspetta che il Narratore distribuisca le carte.',null);
    else out+=cardBtn(PD.card);
    if(pub.phase!=='lobby')out+=def.pview(c,pub,PD.card,me);
    return pShell(out);
  }
  /* ---------- Overlay (passa il telefono) ---------- */
  function renderOv(){
    if(PL.active||!T.rev){$ov.hidden=true;$ov.innerHTML='';return;}
    $ov.hidden=false;var p=P(T.rev.id),h='';
    if(!T.rev.shown)h='<div class="full"><p class="kick">Passa il telefono a</p><h1 class="big">'+esc(p.name)+'</h1><button class="btn pri" data-a="revShow">'+ico('eye')+'Svela la mia carta</button></div>';
    else{var cd=def.card(S,p);h='<div class="full"><p class="kick">'+esc(p.name)+', la tua carta</p>'+ico(cd.ico,72).replace('<svg ','<svg class="rb" ')+'<p class="kick">'+esc(cd.title)+'</p><h1 class="big">'+esc(cd.big)+'</h1>'+(cd.sub?'<p>'+esc(cd.sub)+'</p>':'')+(cd.text?'<p class="muted">'+esc(cd.text)+'</p>':'')+'<button class="btn pri" data-a="revHide">'+(T.rev.seq&&S.players[S.players.length-1].id===p.id?'Nascondi e chiudi':'Nascondi e passa')+'</button></div>';}

  /* ---------- Render ---------- */
  var lastKey='';
  function render(){

    $app.innerHTML=PL.active?playerView():hostView();renderOv();
    window.scrollTo(0,lastKey===k?y:0);lastKey=k;updTimers();

  function updTimers(){
    var els=$app.querySelectorAll('.tmr');
    for(var i=0;i<els.length;i++){var e=+els[i].getAttribute('data-end'),s=Math.max(0,Math.round((e-Date.now())/1000));els[i].textContent=(Math.floor(s/60))+':'+('0'+(s%60)).slice(-2);if(s===0)els[i].classList.add('zero');else els[i].classList.remove('zero');}
  }
  var iv=setInterval(updTimers,1000);
  /* ---------- Azioni ---------- */
  function addName(){

    var i=document.getElementById('newName');if(i)i.focus();
  }
  function act(a,d){
    switch(a){
      case 'hub':return SERATA.askHome();
      case 'modeSingle':S.mode='single';return commit();
      case 'modeMulti':if(!CAP.db)return;S.mode='multi';setRoom(true);return commit();
      case 'changeMode':S.mode=null;setRoom(false);return commit();

      case 'example':['Anna','Bruno','Chiara','Dario','Elena'].forEach(function(n){if(!S.players.some(function(p){return p.name===n;}))S.players.push({id:S.uid++,name:n,alive:true});});return commit();
      case 'deal':case 'reshuffle':if(def.problem(S))return;S.seen={};def.deal(S);S.phase='cards';return commit();
      case 'backSetup':S.phase='setup';return commit();
      case 'revOne':T.rev={id:+d.id,shown:false};return render();

      case 'revSeq':T.rev={id:S.players[0].id,shown:false,seq:true};return render();

<script>
(function(){
'use strict';
var U=SERATA.u,esc=U.esc,ico=U.ico,shuffle=U.shuffle,rnd=U.rnd,pick=U.pick;
function step(label,sub,val,dm,dp,dis){return '<div class="opt"><div class="ot"><b>'+label+'</b><small>'+sub+'</small></div><div class="stepper"><button class="btn" data-a="'+dm+'" aria-label="Meno">−</button><b>'+val+'</b><button class="btn" data-a="'+dp+'" aria-label="Più">+</button></div></div>';}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();}
function grid(c,list,extra){return '<div class="grid">'+list.map(function(p){var on=c.T.sel[0]===p.id;return '<button class="pl" data-a="pick" data-id="'+p.id+'" aria-pressed="'+on+'"><span class="nm">'+esc(p.name)+'</span>'+(on?'<span class="mk">'+ico('check',14)+'</span>':'')+'</button>';}).join('')+'</div>';}
function rotate(list,startId){var i=list.findIndex(function(p){return p.id===startId;});if(i<0)i=0;return list.slice(i).concat(list.slice(0,i));}

/* ===================== MISTER WHITE ===================== */
var PAIRS=[['Pizza','Focaccia'],['Cane','Lupo'],['Gatto','Tigre'],['Mare','Lago'],['Caffè','Tè'],['Spiaggia','Deserto'],['Chitarra','Violino'],['Treno','Tram'],['Aereo','Elicottero'],['Pane','Brioche'],['Sole','Luna'],['Mela','Pera'],['Libro','Quaderno'],['Scuola','Università'],['Dottore','Infermiere'],['Pompiere','Poliziotto'],['Re','Presidente'],['Principessa','Regina'],['Vampiro','Zombie'],['Mago','Stregone'],['Pirata','Ladro'],['Pasta','Riso'],['Gelato','Sorbetto'],['Torta','Biscotto'],['Cioccolato','Nutella'],['Coca-Cola','Pepsi'],['Birra','Vino'],['Hotel','Ostello'],['Montagna','Collina'],['Fiume','Ruscello'],['Rosa','Tulipano'],['Pioggia','Neve'],['Cinema','Teatro'],['Concerto','Discoteca'],['Calcio','Rugby'],['Tennis','Padel'],['Bicicletta','Monopattino'],['Moto','Scooter'],['Telefono','Tablet'],['Computer','Console'],['Instagram','TikTok'],['Netflix','YouTube'],['Batman','Superman'],['Shrek','Ciuchino'],['Pikachu','Charmander'],['Ferrari','Lamborghini'],['Orologio','Sveglia'],['Giacca','Cappotto'],['Scarpe','Stivali'],['Zaino','Valigia'],['Forchetta','Cucchiaio'],['Coltello','Forbici'],['Letto','Divano'],['Bagno','Doccia'],['Matrimonio','Fidanzamento'],['Compleanno','Natale'],['Medico','Veterinario'],['Giornale','Rivista'],['Radio','Podcast'],['Pizzeria','Ristorante'],['Aperitivo','Cena'],['Estate','Primavera'],['Zucchero','Miele'],['Spaghetti','Tagliatelle'],['Panino','Piadina'],['Spritz','Mojito'],['Cappuccino','Latte macchiato']];
var RL={civile:'Civile',under:'Infiltrato',white:'Mister White'};
function mwAuto(n){return {under:n>=10?2:1,white:n>=5?1:0};}
function mwCnt(S){var g=S.g;return g.auto?mwAuto(S.players.length):{under:g.under,white:g.white};}
function mwCheck(S){
  var a=S.players.filter(function(p){return p.alive!==false;}),cc=0,uu=0,ww=0;
  a.forEach(function(p){if(p.role==='civile')cc++;else if(p.role==='under')uu++;else ww++;});
  if(uu+ww===0)return 'civili';
  if(cc<=uu+ww)return 'infiltrati';
  return null;
}
function mwNextStarter(S){
  var i=S.players.findIndex(function(p){return p.id===S.g.starter;}),n=S.players.length;
  for(var k=1;k<=n;k++){var p=S.players[(i+k)%n];if(p.alive!==false&&p.role!=='white')return p.id;}
  for(k=1;k<=n;k++){p=S.players[(i+k)%n];if(p.alive!==false)return p.id;}
  return S.g.starter;
}
function mwOrder(S){return rotate(S.players.filter(function(p){return p.alive!==false;}),S.g.starter);}
function mwEnd(S){
  var w=S.g.winner;
  var t=w==='civili'?['Vincono i Civili','Tutti gli infiltrati sono stati scovati.','vill']:w==='infiltrati'?['Vincono gli Infiltrati','Hanno ingannato il gruppo fino alla fine.','lupi']:['Mister White indovina!','Ha capito la parola dei civili e vince da solo.','amanti'];
  return {title:t[0],sub:t[1],cls:t[2]};
}
SERATA.games.mrwhite=SERATA.party({
  key:'mrwhite',name:'Mister White',icon:'mask',
  lead:'Tutti ricevono una parola: quasi tutti la stessa, uno una parola simile, e Mister White nessuna. Si gira in cerchio dicendo una parola a testa, poi si vota chi eliminare.',
  fresh:function(){return {auto:true,under:1,white:1,cw:'',uw:'',starter:null,round:1,out:null,winner:null,guess:'',guessOk:null};},
  again:function(S){var g=S.g;return {auto:g.auto,under:g.under,white:g.white,cw:'',uw:'',starter:null,round:1,out:null,winner:null,guess:'',guessOk:null};},
  setup:function(S,c){
    var n=S.players.length,k=mwCnt(S),civ=n-k.under-k.white,g=S.g;
    return '<section class="blk"><div class="blkh"><h2>Ruoli segreti</h2><span class="muted">'+Math.max(civ,0)+' civili · '+k.under+' infiltrati · '+k.white+' Mister White</span></div><div class="card">'
    +step('Infiltrati','Hanno una parola simile ma diversa, e non sanno di esserlo.',k.under,'um','up')
    +step('Mister White','Non ha nessuna parola.',k.white,'wm','wp')
    +'<p class="hint">'+(g.auto?'Numeri automatici in base ai giocatori.':'Numeri impostati a mano. <button class="lnk" data-a="mwAuto">Torna ad Auto</button>')+'</p></div></section>';
  },
  problem:function(S){
    var n=S.players.length,k=mwCnt(S);
    if(n<3)return 'Servono almeno 3 persone.';
    if(k.under+k.white<1)return 'Serve almeno un infiltrato o un Mister White.';
    if(n-k.under-k.white<=k.under+k.white)return 'Troppi infiltrati: i civili devono essere più numerosi degli altri.';
    return '';
  },
  deal:function(S){
    var g=S.g,pr=pick(PAIRS).slice().map(SERATA.tw);if(rnd(2))pr.reverse();g.cw=pr[0];g.uw=pr[1];
    var k=mwCnt(S),list=[],i;
    for(i=0;i<k.under;i++)list.push('under');
    for(i=0;i<k.white;i++)list.push('white');
    while(list.length<S.players.length)list.push('civile');
    shuffle(list);
    S.players.forEach(function(p,j){p.role=list[j];p.word=p.role==='civile'?g.cw:p.role==='under'?g.uw:null;p.alive=true;});
    var cand=S.players.filter(function(p){return p.role!=='white';});
    g.starter=pick(cand).id;g.round=1;g.out=null;g.winner=null;g.guess='';g.guessOk=null;
  },
  begin:function(S){S.phase='play';},
  card:function(S,p){
    if(p.role==='white')return {ico:'mask',title:'Sei',big:'Mister White',sub:'Non hai nessuna parola.',text:'Ascolta gli altri e bluffa. Se vieni eliminato puoi ancora vincere indovinando la parola dei civili.'};
    return {ico:'eye',title:'La tua parola',big:p.word,sub:'Descrivila senza dirla.',text:'Non sai se gli altri hanno la tua stessa parola: scoprilo ascoltando.'};
  },
  pubPlayer:function(S,p){var x={};if(p.alive===false||S.phase==='end'){x.rname=RL[p.role];x.team=p.role;}if(S.phase==='end')x.word=p.word||null;return x;},
  pub:function(S){
    var g=S.g,o={round:g.round,starter:g.starter,order:S.phase==='setup'?[]:mwOrder(S).map(function(p){return p.id;}),winner:g.winner,out:g.out?{id:g.out.id,rname:g.out.id!=null?RL[g.out.role]:null,guessOk:g.guessOk}:null};
    if(S.phase==='end'){o.endTxt=mwEnd(S);o.words={c:g.cw,u:g.uw};}
    return o;
  },
  view:function(S,c){
    var g=S.g,ph=S.phase,alive=S.players.filter(function(p){return p.alive!==false;}),P=c.P;
    var stats='<div class="stats"><span>Giro '+g.round+'</span><span>In gioco '+alive.length+'</span></div>';
    if(ph==='play'){
      var ord=mwOrder(S);
      return stats+'<h1 class="h1">Una parola a testa</h1><p class="lead">Ognuno dice una sola parola che descrive la sua, senza ripeterla e senza essere troppo ovvio. Si gira in questo ordine, poi si discute.</p><ol class="rows ord">'+ord.map(function(p,i){return '<li class="row"><span class="nm"><b>'+(i+1)+'.</b> '+esc(p.name)+'</span>'+(i===0?'<span class="chip">Inizia</span>':'')+'</li>';}).join('')+'</ol><div class="bar"><button class="btn pri block" data-a="mwVote">Si vota</button></div>';
    }
    if(ph==='vote')return stats+'<h1 class="stept">Chi viene eliminato?</h1>'+grid(c,alive)+'<div class="bar"><button class="btn" data-a="mwBack">'+ico('back')+'Indietro</button><button class="btn" data-a="mwNone">Nessuno (parità)</button><button class="btn bad" data-a="mwGo" '+(c.T.sel.length?'':'disabled')+'>Elimina</button></div>';

      return stats+'<h1 class="big">Il verdetto</h1>'+body+'<div class="bar"><button class="btn pri block" data-a="mwNext">'+(g.winner?'Scopri com’è finita':'Prossimo giro')+'</button></div>';
    }
    if(ph==='end'){
      var e=mwEnd(S);
      return '<div class="banner '+e.cls+'"><h1 class="big">'+esc(e.title)+'</h1><p>'+esc(e.sub)+'</p></div><div class="card"><p class="muted">Parola dei civili</p><div class="code" style="font-size:2.2rem;letter-spacing:.04em">'+esc(g.cw)+'</div><p class="muted">Parola degli infiltrati: <b>'+esc(g.uw)+'</b></p></div><div class="blkh mt20"><h2>Chi era chi</h2></div><ul class="rows">'+S.players.map(function(p){return '<li class="row '+(p.alive===false?'dead':'')+'"><span class="nm">'+esc(p.name)+'</span><span class="rx"><span class="tag '+(p.role==='civile'?'vill':p.role==='white'?'spec':'lupi')+'">'+esc(RL[p.role])+(p.word?' · '+esc(p.word):'')+'</span></span></li>';}).join('')+'</ul><div class="bar"><button class="btn" data-a="again">Stessi giocatori</button><button class="btn pri" data-a="newgame">Nuova partita</button></div>';
    }
    return '';
  },
  act:function(a,d,c){
    var S=c.S,g=S.g,n=S.players.length;
    var set=function(u,w){var k=mwCnt(S);g.auto=false;g.under=Math.max(0,Math.min(u===undefined?k.under:u,6));g.white=Math.max(0,Math.min(w===undefined?k.white:w,3));c.commit();};
    var k=mwCnt(S);
    switch(a){
      case 'um':return set(k.under-1);case 'up':return set(k.under+1);
      case 'wm':return set(undefined,k.white-1);case 'wp':return set(undefined,k.white+1);
      case 'mwAuto':g.auto=true;return c.commit();
      case 'mwVote':S.phase='vote';c.T.sel=[];return c.commit();
      case 'mwBack':S.phase='play';return c.commit();
      case 'mwNone':g.out={id:null};S.phase='result';c.T.sel=[];return c.commit();
      case 'mwGo':{
        var id=c.T.sel[0],p=c.P(id);if(!p)return;p.alive=false;g.out={id:id,role:p.role};c.T.sel=[];g.guess='';g.guessOk=null;
        if(p.role==='white'){S.phase='guess';return c.commit();}
        g.winner=mwCheck(S);S.phase='result';return c.commit();}
      case 'mwNext':
        if(g.winner){S.phase='end';return c.commit();}
        g.round++;g.starter=mwNextStarter(S);g.out=null;S.phase='play';return c.commit();
    }
  },
  input:function(el,c){if(el.id==='guessIn')c.S.g.guess=el.value;},

    if(norm(v)===norm(g.cw)){g.winner='white';g.guessOk=true;S.phase='end';return c.commit();}
    g.guessOk=false;g.winner=mwCheck(S);S.phase='result';c.commit();
  },
  pview:function(c,pub,card,me){
    var ph=pub.phase,out='',pn=function(id){var p=pub.players.find(function(x){return x.id===id;});return p?p.name:'';};

    }else if(ph==='vote')out+='<div class="nightbox mt14"><h1 class="big">Si vota.</h1><p>Decidete insieme chi eliminare.</p></div>';
    else if(ph==='guess')out+='<div class="spell mt14">'+ico('mask',22)+'<span>'+esc(pn(pub.out&&pub.out.id))+' era Mister White e sta provando a indovinare la parola.</span></div>';
    else if(ph==='result'){

    }else if(ph==='end'){
      var et=pub.endTxt||{title:'Fine',sub:'',cls:'vill'};
      out+='<div class="banner '+et.cls+' mt14"><h1 class="big">'+esc(et.title)+'</h1><p>'+esc(et.sub)+'</p></div><div class="card"><p class="muted">Parola dei civili</p><div class="code" style="font-size:2.2rem;letter-spacing:.04em">'+esc(pub.words.c)+'</div><p class="muted">Parola degli infiltrati: <b>'+esc(pub.words.u)+'</b></p></div><ul class="rows">'+pub.players.map(function(p){return '<li class="row '+(p.alive?'':'dead')+'"><span class="nm">'+esc(p.name)+(p.id===me.id?' (tu)':'')+'</span><span class="rx"><span class="tag '+(p.team==='civile'?'vill':p.team==='white'?'spec':'lupi')+'">'+esc(p.rname||'')+(p.word?' · '+esc(p.word):'')+'</span></span></li>';}).join('')+'</ul>';
    }
    if(ph!=='end'&&ph!=='cards')out+='<ul class="rows mt14">'+pub.players.map(function(p){return '<li class="row '+(p.alive?'':'dead')+'"><span class="nm">'+esc(p.name)+(p.id===me.id?' (tu)':'')+'</span><span class="rx">'+(p.rname?'<span class="tag spec">'+esc(p.rname)+'</span>':'')+'</span></li>';}).join('')+'</ul>';
    return out;
  }
});

}

var AR={assassino:'Assassino',detective:'Detective',guaritrice:'Guaritrice',innocente:'Innocente'};
function asKillers(S){var g=S.g,n=S.players.length;return g.auto?(n>=10?2:1):g.killers;}
function healables(S){return S.players.filter(function(p){return p.alive===false&&p.how==='dead';});}
function canHeal(S){return !S.g.healUsed&&S.players.some(function(p){return p.role==='guaritrice'&&p.alive!==false;})&&healables(S).length>0;}

function brNext(S,pid){
  var ring=S.g.ring,i=ring.indexOf(pid),n=ring.length;
  for(var k=1;k<n;k++){var id=ring[(i+k)%n],p=S.players.find(function(x){return x.id===id;});if(p&&p.alive!==false)return id;}
  return null;
}
function brPrev(S,pid){
  var ring=S.g.ring,i=ring.indexOf(pid),n=ring.length;
  for(var k=1;k<n;k++){var id=ring[(i-k+n*2)%n],p=S.players.find(function(x){return x.id===id;});if(p&&p.alive!==false)return id;}
  return null;
}

  deal:function(S){

  pubPlayer:function(S,p){var x={};if(p.alive===false||S.phase==='end'){x.rname=p.role==='intruso'?'Intruso':'Civile';x.team=p.role;}return x;},
  pub:function(S){var g=S.g,o={round:g.round,starter:g.starter,order:S.phase==='setup'?[]:rotate(S.players.filter(function(p){return p.alive!==false;}),g.starter).map(function(p){return p.id;}),winner:g.winner,out:g.out?{id:g.out.id,rname:g.out.id!=null?(g.out.role==='intruso'?'Intruso':'Civile'):null}:null};if(S.phase==='end'){o.endTxt=inEnd(S);o.qs={c:g.qc,u:g.qu};}return o;},
  view:function(S,c){

  act:function(a,d,c){

  fresh:function(){return {max:10,rule:'half',guesser:null,hist:[],draft:{to:null,q:null},res:null,winner:null};},

  deal:function(S){

    var pool=[],i;for(i=1;i<=g.max;i++)pool.push(i);shuffle(pool);

  begin:function(S){S.phase='play';},
  card:function(S,p){
    var g=S.g;
    if(p.id===g.guesser)return {ico:'question',title:'Sei tu',big:'a indovinare',sub:'Non conosci nessun numero.',text:'Fai domande agli altri: ognuno risponde con qualcosa che, secondo lui, rappresenta il suo numero. Alla fine dovrai dire i numeri.'};

  },
  pubPlayer:function(S,p){var x={};if(S.phase==='end'&&p.id!==S.g.guesser)x.num=p.num;return x;},
  pub:function(S){
    var g=S.g,P=function(id){return S.players.find(function(p){return p.id===id;});},o={guesser:g.guesser,max:g.max,need:nmNeed(S),winner:g.winner,

  },

      else if(!d.q){var t=P(d.to);body='<h1 class="stept">Domanda per '+esc(t.name)+'</h1><div class="qlist">'+NQ.map(function(q,i){return '<button class="btn block" data-a="nmQ" data-id="'+i+'">'+esc(q)+'</button>';}).join('')+'</div><form class="add mt14" data-form="nmq"><input id="nmqIn" type="text" maxlength="80" autocomplete="off" placeholder="Oppure scrivine una tua"><button class="btn pri" type="submit">Usa</button></form><div class="bar"><button class="btn" data-a="nmCancel">'+ico('back')+'Indietro</button></div>';}

  act:function(a,d,c){

      case 'nmp':i=NMAX.indexOf(g.max);g.max=NMAX[Math.min(NMAX.length-1,i+1)];return c.commit();
      case 'nmr':g.rule=g.rule==='all'?'half':'all';return c.commit();

  pubPlayer:function(S,p){return {};},
  pub:function(S){var g=S.g;return {thinker:g.thinker,cat:g.cat,qn:g.qn,qmax:g.qmax,tries:g.tries,triesMax:g.triesMax,winner:g.winner,secret:S.phase==='end'?g.secret:'',endTxt:S.phase==='end'?(g.winner==='gruppo'?{title:'Hanno indovinato!',sub:'Il segreto è stato scoperto.',cls:'vill'}:{title:'Il segreto resiste',sub:'Nessuno ci è arrivato in tempo.',cls:'lupi'}):null};},
  view:function(S,c){
    var g=S.g,ph=S.phase,t=c.P(g.thinker);
    var stats='<div class="stats"><span>Domande '+g.qn+'/'+g.qmax+'</span><span>Tentativi '+g.tries+'/'+g.triesMax+'</span></div>';
    if(ph==='play')return stats+'<h1 class="h1">Cosa pensa '+esc(t?t.name:'')+'?</h1>'+(g.cat?'<p class="lead">Tema: <b>'+esc(g.cat)+'</b></p>':'')+'<p class="lead">Fate domande a cui si risponde solo sì o no. Segna qui ogni domanda e ogni tentativo.</p>'
      +'<div class="bar"><button class="btn pri block" data-a="pqAsk" '+(g.qn>=g.qmax?'disabled':'')+'>Domanda fatta (+1)</button></div>'

      +'<section class="blk"><div class="blkh"><h2>Domande che aiutano</h2></div><div class="card"><ul class="plain">'+PQ.map(function(q){return '<li>'+esc(q)+'</li>';}).join('')+'</ul></div></section>'

    var S=c.S,g=S.g;

      case 'pqp':g.qmax=Math.min(40,g.qmax+1);return c.commit();

      case 'ptp':g.triesMax=Math.min(6,g.triesMax+1);return c.commit();

      case 'pqUndo':if(g.qn)g.qn--;return c.commit();

    return out;
  }
});
})();
</script>

/* ---------- Logica di gioco ---------- */
function kill(id,cause,out){
  var p=P(id);if(!p||!p.alive)return;
  p.alive=false;p.cause=cause;p.diedN=S.night;out.push(id);
  if(p.role==='cacciatore')S.pendingHunter=id;
  if(p.lover!=null){var q=P(p.lover);if(q&&q.alive)kill(q.id,'amore',out);}
}
function winner(){
  var a=S.players.filter(function(p){return p.alive;});
  if(!a.length)return 'nessuno';
  var side=function(p){return p.role==='lupo'||p.role==='traditore';};
  if(a.length===2&&a[0].lover===a[1].id&&(side(a[0])!==side(a[1])))return 'amanti';
  var wc=a.filter(function(p){return p.role==='lupo';}).length,sc=a.filter(side).length;
  if(wc===0)return 'vill';
  if(sc>=a.length-sc)return 'lupi';
  return null;
}
function nightSteps(){
  var s=[];
  if(S.night===1&&byRole('cupido'))s.push('cupido');
  if(S.night===1&&byRole('massone'))s.push('massone');
  ['cortigiana','circe','avvocato','guardia','medico','veggente','investigatore','ficcanaso'].forEach(function(k){if(byRole(k))s.push(k);});
  s.push('lupi');
  if(byRole('fattore'))s.push('fattore');
  ['negromante','sentinella'].forEach(function(k){if(byRole(k))s.push(k);});
  return s;
}
function stepRole(k){return k==='lupi'?'lupo':k;}
function stepState(k){
  if(k==='lupi'||k==='massone')return 'ok';
  var a=byRole(stepRole(k));
  if(!a||!a.alive)return 'dead';
  if(k!=='cortigiana'&&k!=='cupido'&&S.nd.block!=null&&S.nd.block===a.id)return 'blocked';
  if(k==='fattore'&&S.shotUsed)return 'used';
  if(k==='negromante'&&S.reviveUsed)return 'used';
  if(k==='ficcanaso'&&S.peekUsed)return 'used';
  return 'ok';
}
function visited(id){
  var nd=S.nd,t=[];
  if(nd.lovers)t=t.concat(nd.lovers);
  ['block','hex','lawyer','guard','protect','wolf','shot','revive'].forEach(function(f){if(nd[f]!=null)t.push(nd[f]);});
  if(nd.seer)t.push(nd.seer.t);if(nd.inv)t=t.concat(nd.inv.t);if(nd.peek)t.push(nd.peek.t);
  return t.indexOf(id)>-1;
}
function startNight(){
  S.night+=1;S.step=0;S.nd={};S.phase='night';S.dawn=null;S.dayMode='list';S.voteRes=null;S.hexNow=null;S.shield=null;T.selFor='';T.peek=false;
  lg(th().dusk,0,'n');keepAwake();
}
function civCount(){var n=S.players.length;return S.cfg.civAuto===false?(S.cfg.civili||0):Math.max(0,n-lupiCount()-spSlots());}
function spSlots(){var n=0;SPECIAL.forEach(function(r){if(S.cfg[r])n+=MULTI[r]||1;});return n;}
function problemSetup(){
  var n=S.players.length,l=lupiCount(),sp=spSlots(),side=l+(S.cfg.traditore?1:0);
  if(n<5)return 'Servono almeno 5 persone.';
  if(l+sp>n)return 'Ci sono più ruoli che persone.';
  if(side>=n-side)return 'Troppi lupi: avrebbero già vinto.';
  var tot=l+sp+civCount();
  if(tot!==n)return 'La somma dei ruoli è '+tot+' ma i giocatori sono '+n+': regola i ruoli normali (oppure tocca Auto).';
  return '';
}
function problemRoles(){
  var c={};ROLEIDS.forEach(function(r){c[r]=0;});S.players.forEach(function(p){c[p.role]++;});
  var n=S.players.length,side=c.lupo+c.traditore;
  if(c.lupo<1)return 'Serve almeno un '+rn('lupo')+'.';
  if(side>=n-side)return 'Troppi lupi: avrebbero già vinto.';
  for(var i=0;i<SPECIAL.length;i++){var r=SPECIAL[i];if(r!=='massone'&&r!=='traditore'&&c[r]>1)return 'Può esserci un solo ruolo: '+rn(r)+'.';}
  if(c.traditore>1)return 'Può esserci un solo ruolo: '+rn('traditore')+'.';
  if(c.massone!==0&&c.massone!==2)return 'Servono esattamente due persone con il ruolo '+rn('massone')+'.';
  return '';
}
function deal(){
  var n=S.players.length,list=[],i;
  for(i=0;i<lupiCount();i++)list.push('lupo');
  SPECIAL.forEach(function(r){if(S.cfg[r])for(var q=0;q<(MULTI[r]||1);q++)list.push(r);});
  for(i=0;i<civCount();i++)list.push('civile');
  while(list.length<n)list.push('civile');
  list.length=n;
  shuffle(list);S.players.forEach(function(p,k){p.role=list[k];p.alive=true;p.lover=null;p.cause=null;});
  S.phase='roles';
}
function startGame(){
  S.players.forEach(function(p){p.alive=true;p.lover=null;p.cause=null;});
  S.night=0;S.log=[];S.lastProtect=null;S.pendingHunter=null;S.winner=null;S.shotUsed=false;S.hexNow=null;S.jester=null;startNight();
}
function commitStep(k,sel,st){
  var ok=st==='ok',v=ok&&sel.length?sel[0]:null;
  if(k==='cupido')S.nd.lovers=ok?sel.slice():null;
  else if(k==='massone'){}
  else if(k==='cortigiana')S.nd.block=v;
  else if(k==='circe')S.nd.hex=v;
  else if(k==='avvocato')S.nd.lawyer=v;
  else if(k==='guardia')S.nd.guard=v;
  else if(k==='medico')S.nd.protect=v;
  else if(k==='veggente')S.nd.seer=v==null?null:{t:v,res:P(v).role==='lupo'};
  else if(k==='investigatore')S.nd.inv=(ok&&sel.length===2)?{t:sel.slice(),same:(P(sel[0]).role==='lupo')===(P(sel[1]).role==='lupo')}:null;
  else if(k==='lupi')S.nd.wolf=sel[0];
  else if(k==='fattore')S.nd.shot=v;
  else if(k==='ficcanaso')S.nd.peek=v==null?null:{t:v,role:P(v).role};
  else if(k==='negromante')S.nd.revive=v;
  else if(k==='sentinella')S.nd.sentinel=v==null?null:{t:v,res:visited(v)};
}
function goDay(){
  var nd=S.nd,ok=function(k){return stepState(k)==='ok';},nz=function(x){return x==null?null:x;};
  var d={n:S.night,lovers:(S.night===1&&ok('cupido')&&nd.lovers)?nd.lovers:null,block:ok('cortigiana')?nz(nd.block):null,hex:ok('circe')?nz(nd.hex):null,lawyer:ok('avvocato')?nz(nd.lawyer):null,guard:ok('guardia')?nz(nd.guard):null,protect:ok('medico')?nz(nd.protect):null,seer:ok('veggente')?(nd.seer||null):null,inv:ok('investigatore')?(nd.inv||null):null,wolf:nz(nd.wolf),shot:ok('fattore')?nz(nd.shot):null,peek:ok('ficcanaso')?(nd.peek||null):null,revive:ok('negromante')?nz(nd.revive):null,sent:ok('sentinella')?(nd.sentinel||null):null,survived:null,revived:null,saved:false,sacrificed:null,deaths:[]};
  if(d.lovers){P(d.lovers[0]).lover=d.lovers[1];P(d.lovers[1]).lover=d.lovers[0];lg(rn('cupido')+' lega '+P(d.lovers[0]).name+' e '+P(d.lovers[1]).name+'.',1,'n');}
  if(d.block!=null)lg(rn('cortigiana')+' occupa '+P(d.block).name+': la sua azione è annullata.',1,'n');
  if(d.hex!=null)lg(rn('circe')+' '+hxf('do').replace('{n}',P(d.hex).name)+'.',1,'n');
  if(d.lawyer!=null)lg(rn('avvocato')+' difende '+P(d.lawyer).name+' dal voto di domani.',1,'n');
  if(d.seer)lg(rn('veggente')+' scruta '+P(d.seer.t).name+': '+(d.seer.res?'è un ':'non è un ')+th().wolf+'.',1,'n');
  if(d.inv)lg(rn('investigatore')+' confronta '+P(d.inv.t[0]).name+' e '+P(d.inv.t[1]).name+': '+(d.inv.same?'stessa parte.':'parti opposte.'),1,'n');
  if(d.guard!=null)lg(rn('guardia')+' protegge '+P(d.guard).name+'.',1,'n');
  if(d.protect!=null)lg(rn('medico')+' protegge '+P(d.protect).name+'.',1,'n');
  if(d.wolf!=null){
    lg(cap(th().wolves)+' puntano '+P(d.wolf).name+'.',1,'n');
    var g=byRole('guardia');
    if(d.wolf===d.protect){d.saved=true;lg(P(d.wolf).name+' è stato salvato.',1,'n');}
    else if(d.guard===d.wolf&&g&&g.alive&&g.id!==d.wolf){d.sacrificed=g.id;kill(g.id,'sacrificio',d.deaths);lg(g.name+' si sacrifica al posto di '+P(d.wolf).name+'.',1,'n');}
    else if(P(d.wolf).role==='anziano'&&!S.elderUsed){S.elderUsed=true;d.survived=d.wolf;lg(P(d.wolf).name+' ('+rn('anziano')+') resiste all’attacco.',1,'n');}
    else kill(d.wolf,'lupi',d.deaths);
  }
  if(d.shot!=null){S.shotUsed=true;lg(rn('fattore')+' spara a '+P(d.shot).name+'.',1,'n');kill(d.shot,'fucile',d.deaths);}
  var kd=byRole('bimbo');
  if(kd&&kd.alive&&nd.kid===2){kill(kd.id,'scoperto',d.deaths);d.kidCaught=kd.id;lg(kd.name+' ('+rn('bimbo')+') viene scoperto mentre sbircia.',1,'n');}
  else if(kd&&kd.alive&&nd.kid===1){S.kidSeen=true;d.kidPeek=kd.id;lg(kd.name+' ('+rn('bimbo')+') sbircia senza essere visto e scopre chi sono i '+th().wolves.replace(/^i |^gli /,'')+'.',1,'n');}
  if(d.peek){S.peekUsed=true;lg(rn('ficcanaso')+' sbircia '+P(d.peek.t).name+': è '+rn(d.peek.role)+'.',1,'n');}
  if(d.sent)lg(rn('sentinella')+' osserva '+P(d.sent.t).name+': '+(d.sent.res?'qualcuno ha agito su di lui.':'nessuno ha agito su di lui.'),1,'n');
  if(d.revive!=null&&!P(d.revive).alive){var rv=P(d.revive);rv.alive=true;rv.cause=null;S.reviveUsed=true;d.revived=rv.id;lg(rn('negromante')+' riporta in vita '+rv.name+'.',0,'n');}
  S.lastProtect=d.protect;S.hexNow=d.hex;S.shield=d.lawyer;
  d.deaths.forEach(function(id){lg(P(id).name+' muore ('+rn(P(id).role)+', '+th().causes[P(id).cause]+').',0,'n');});
  if(!d.deaths.length)lg('Notte tranquilla: nessun morto.',0,'n');
  if(d.hex!=null)lg(hxIs(P(d.hex).name),0,'g');
  S.dawn=d;S.phase='dawn';buzz();
}
function advance(next){
  if(S.pendingHunter!=null){S.phase='hunter';S.after=next;S.hunterRes=null;return;}
  if(S.jester!=null){S.winner='giullare';S.phase='end';lg('Fine partita.',0,'g');return;}
  var w=winner();
  if(w){S.winner=w;S.phase='end';lg('Fine partita.',0,'g');return;}
  if(next==='night')startNight();else{S.phase='day';S.dayMode='list';}
}
function doVote(id){
  var out=[],shielded=false,scape=false;
  if(id==null){var cg=byRole('capro');if(cg&&cg.alive){id=cg.id;scape=true;}}
  if(id!=null){
    if(!scape&&S.shield===id)shielded=true;
    else{kill(id,'voto',out);if(P(id).role==='giullare')S.jester=id;}
  }
  S.voteRes={t:id,deaths:out,shielded:shielded,scape:scape};
  if(id==null)lg('Il villaggio non elimina nessuno.',0,'g');
  else if(scape)lg('Parità: '+P(id).name+' ('+rn('capro')+') viene eliminato al posto di tutti.',0,'g');
  else if(shielded)lg('Il villaggio vota '+P(id).name+', ma qualcuno lo ha difeso: nessuno viene eliminato.',0,'g');
  else lg('Il villaggio elimina '+P(id).name+' ('+rn(P(id).role)+').',0,'g');
  out.slice(1).forEach(function(x){lg(P(x).name+' muore ('+rn(P(x).role)+', '+th().causes.amore+').',0,'g');});

}
function shoot(id){

function endTexts(){

  var sub=w==='lupi'?'Non resta nessuno in grado di fermarli.':w==='vill'?'Ogni '+t.wolf+' è stato scovato.':w==='amanti'?'Uno era un '+t.wolf+', l’altro no. Ma l’amore ha vinto su tutto.':w==='giullare'?'Si è fatto eliminare e ha beffato tutti.':'Silenzio assoluto.';

function recapItems(d){
  var L=[],pn=function(id){return P(id).name;};
  if(d.lovers)L.push(['heart',rn('cupido')+' ha legato '+pn(d.lovers[0])+' e '+pn(d.lovers[1])+'.']);
  if(d.block!=null)L.push([ri('cortigiana'),rn('cortigiana')+' ha passato la notte con '+pn(d.block)+'.']);
  if(d.hex!=null)L.push([ri('circe'),rn('circe')+' '+hxf('did').replace('{n}',pn(d.hex))+'.']);
  if(d.lawyer!=null)L.push([ri('avvocato'),rn('avvocato')+' ha difeso '+pn(d.lawyer)+' dal voto di oggi.']);
  if(d.seer)L.push([ri('veggente'),rn('veggente')+' ha scrutato '+pn(d.seer.t)+': '+(d.seer.res?'è un ':'non è un ')+th().wolf+'.']);
  if(d.inv)L.push([ri('investigatore'),rn('investigatore')+' ha confrontato '+pn(d.inv.t[0])+' e '+pn(d.inv.t[1])+': '+(d.inv.same?'stanno dalla stessa parte.':'stanno da parti opposte.')]);
  if(d.guard!=null)L.push([ri('guardia'),rn('guardia')+' ha protetto '+pn(d.guard)+(d.sacrificed!=null?' e ha dato la vita.':'.')]);
  if(d.protect!=null)L.push([ri('medico'),rn('medico')+' ha protetto '+pn(d.protect)+'.']);
  if(d.wolf!=null)L.push(['wolf',cap(th().wolves)+' hanno puntato '+pn(d.wolf)+(d.saved?', ma è stato salvato.':d.sacrificed!=null?', ma la Guardia ha preso il suo posto.':d.survived!=null?', ma ha resistito.':'.')]);
  if(d.kidCaught!=null)L.push([ri('bimbo'),rn('bimbo')+' ha sbirciato ed è stato scoperto.']);
  if(d.kidPeek!=null)L.push([ri('bimbo'),rn('bimbo')+' ha sbirciato senza essere visto.']);
  if(d.peek)L.push([ri('ficcanaso'),rn('ficcanaso')+' ha sbirciato la carta di '+pn(d.peek.t)+'.']);
  if(d.sent)L.push([ri('sentinella'),rn('sentinella')+' ha osservato '+pn(d.sent.t)+': '+(d.sent.res?'qualcuno ha agito su di lui.':'nessuno ha agito su di lui.')]);
  if(d.revived!=null)L.push([ri('negromante'),rn('negromante')+' ha riportato in vita '+pn(d.revived)+'.']);
  if(d.shot!=null)L.push([ri('fattore'),rn('fattore')+' ha sparato a '+pn(d.shot)+'.']);
  return L;
}

/* ---------- Stanza: sincronizzazione (Narratore) ---------- */
var SYNC={pub:'',cards:{},q:Promise.resolve()};
function roomOn(){return !!(S.room&&S.room.on&&CAP.db&&S.room.code);}
function buildPub(){
  var ph=(S.phase==='home'||S.phase==='roles')?(S.room.sent?'cards':'lobby'):S.phase;
  var d=S.dawn,showD=d&&(S.phase==='dawn'||S.phase==='day'||S.phase==='hunter'||S.phase==='end');
  var end=S.phase==='end';
  return {v:1,game:'lupus',code:S.room.code,theme:S.theme,phase:ph,night:S.night,
    players:S.players.map(function(p){
      var rev=end||(!p.alive&&S.opts.revealDeath)||(p.alive&&p.role==='sindaco'&&S.phase!=='home'&&S.phase!=='roles'),o={id:p.id,name:p.name,alive:p.alive};
      if(!p.alive)o.cause=th().causes[p.cause]||'';
      if(rev&&p.role){o.rname=rn(p.role);o.ico=ri(p.role);o.team=team(p.role);}
      return o;}),
    dawn:showD?{deaths:d.deaths.slice(),revived:d.revived==null?null:d.revived,recap:S.opts.revealAll?recapItems(d).map(function(x){return {i:x[0],t:x[1]};}):null}:null,
    hex:(S.phase==='dawn'||S.phase==='day'||S.phase==='hunter')&&S.hexNow!=null?S.hexNow:null,
    vote:(S.phase==='day'&&S.dayMode==='result'&&S.voteRes)?{t:S.voteRes.t,deaths:S.voteRes.deaths.slice(),shielded:!!S.voteRes.shielded,scape:!!S.voteRes.scape}:null,
    hunter:S.phase==='hunter'&&S.pendingHunter!=null?S.pendingHunter:null,
    winner:end?S.winner:null,
    endTxt:end?endTexts():null,
    log:end?S.log.filter(function(e){return !e.s;}).map(function(e){return {ph:e.ph,n:e.n,t:e.t};}):null};
}
function buildCard(p){
  var mates=null;
  if(p.role==='lupo')mates=S.players.filter(function(q){return q.role==='lupo'&&q.id!==p.id;}).map(function(q){return q.name;});
  if(p.role==='massone')mates=S.players.filter(function(q){return q.role==='massone'&&q.id!==p.id;}).map(function(q){return q.name;});
  return {id:p.id,name:p.name,role:p.role,rname:rn(p.role),rdesc:rd(p.role),ico:ri(p.role),team:team(p.role),alive:p.alive,
    cause:p.cause?(th().causes[p.cause]||''):null,
    lover:(p.lover!=null&&P(p.lover))?P(p.lover).name:null,mates:mates,seen:(p.role==='bimbo'&&S.kidSeen)?S.players.filter(function(q){return q.role==='lupo';}).map(function(q){return q.name;}):null,
    hexed:S.hexNow===p.id&&(S.phase==='dawn'||S.phase==='day'||S.phase==='hunter')};
}
function syncRoom(){
  if(DEAD||!roomOn())return;
  var tasks=[],code=S.room.code;
  if(S.room.sent){S.players.forEach(function(p){var c=JSON.stringify(buildCard(p));if(SYNC.cards[code+p.id]!==c){SYNC.cards[code+p.id]=c;tasks.push(function(){return CAP.db.doc('rooms/'+code+'/cards/p'+p.id).set(JSON.parse(c));});}});}
  var pub=JSON.stringify(buildPub());
  if(SYNC.pub!==code+pub){SYNC.pub=code+pub;tasks.push(function(){return CAP.db.doc('rooms/'+code).set(JSON.parse(pub));});}
  tasks.forEach(function(t){SYNC.q=SYNC.q.then(t).then(function(){if(T.syncErr){T.syncErr=false;render();}}).catch(function(){if(!T.syncErr){T.syncErr=true;render();}});});
}
function leaveNarrRoom(){if(T.nr){try{T.nr.leave();}catch(e){}T.nr=null;}T.online={};T.onlineKey='';}
function autoAdd(ch){
  if(S.phase!=='home'||!S.room.on)return false;
  var changed=false;
  ch.peers.forEach(function(p){
    var w=p.presence&&p.presence.want;
    if(typeof w!=='string')return;
    w=w.trim().slice(0,20);if(!w)return;
    if(S.players.length>=24)return;
    if(S.players.some(function(x){return x.name.toLowerCase()===w.toLowerCase();}))return;
    S.players.push({id:S.uid++,name:w,role:'civile',alive:true,lover:null,cause:null});changed=true;
  });
  return changed;
}
function ensureNarrRoom(){
  if(DEAD||!CAP.room||!roomOn()||T.nr||T.nrBusy)return;
  T.nrBusy=true;
  CAP.room.join('lupus-'+S.room.code.toLowerCase()).then(function(r){
    T.nrBusy=false;T.nr=r;
    r.onPeers(function(ch){
      if(PL.active)return;
      var ids={};ch.peers.forEach(function(p){var pid=p.presence&&p.presence.pid;if(pid!=null)ids[pid]=1;});
      var k=Object.keys(ids).sort().join(),oc=false;
      if(k!==T.onlineKey){T.onlineKey=k;T.online=ids;oc=true;}
      if(autoAdd(ch)){commit();}
      else if(oc&&(S.phase==='home'||S.phase==='roles'))render();
    });
  }).catch(function(){T.nrBusy=false;});
}
function setRoom(on){
  if(on){S.room={on:true,code:newCode(),sent:false};SYNC.pub='';SYNC.cards={};leaveNarrRoom();ensureNarrRoom();}
  else{S.room={on:false,code:'',sent:false};leaveNarrRoom();}
}

/* ---------- Stanza: lato giocatore ---------- */
function stopWatch(){
  if(PD.u1){PD.u1();PD.u1=null;}if(PD.u2){PD.u2();PD.u2=null;}
  if(PD.timer){clearTimeout(PD.timer);PD.timer=null;}
  if(PD.nr){try{PD.nr.leave();}catch(e){}PD.nr=null;}
  PD.nrBusy=false;PD.cardFor=null;PD.pub=null;PD.card=null;
}
function pPresence(){
  if(!CAP.room||!PL.code)return;
  var set=function(){try{PD.nr.presence({want:PL.want||null,pid:PL.pid==null?null:PL.pid});}catch(e){}};
  if(PD.nr){set();return;}
  if(PD.nrBusy)return;
  PD.nrBusy=true;
  CAP.room.join('lupus-'+PL.code.toLowerCase()).then(function(r){PD.nrBusy=false;PD.nr=r;set();}).catch(function(){PD.nrBusy=false;});
}
function startWatch(){
  stopWatch();
  if(!CAP.db||!PL.code)return;
  PD.loading=true;PD.slow=false;
  PD.timer=setTimeout(function(){if(PD.loading){PD.slow=true;render();}},10000);
  PD.u1=CAP.db.doc('rooms/'+PL.code).onSnapshot(function(s){
    PD.loading=false;PD.slow=false;PD.pub=s.exists?s.data():null;
    if(PD.pub&&PL.pid==null&&PL.want){
      var m=PD.pub.players.find(function(p){return p.name.toLowerCase()===PL.want.toLowerCase();});
      if(m){PL.pid=m.id;savePL();}
    }
    watchCard();if(PL.want||PL.pid!=null)pPresence();render();
  },function(){PD.loading=false;PD.slow=true;render();});
}
function watchCard(){
  if(PL.pid==null||!PD.pub||PD.cardFor===PL.pid)return;
  if(PD.u2){PD.u2();PD.u2=null;}
  PD.cardFor=PL.pid;
  PD.u2=CAP.db.doc('rooms/'+PL.code+'/cards/p'+PL.pid).onSnapshot(function(s){
    var was=PD.card&&PD.card.alive;PD.card=s.exists?s.data():null;
    if(was&&PD.card&&PD.card.alive===false)buzz();
    render();
  },function(){});
  pPresence();
}

function say(k){
  var t=th(),n=rn(stepRole(k));

   massone:'I due '+rn('massone')+', aprite gli occhi e riconoscetevi in silenzio. Poi richiudete gli occhi.',
   cortigiana:n+', apri gli occhi e indica con chi passi la notte. Poi richiudi gli occhi.',
   circe:n+', apri gli occhi e indica chi '+hxf('say')+'. Poi richiudi gli occhi.',
   avvocato:n+', apri gli occhi e indica chi difendi: domani il voto non potrà eliminarlo. Poi richiudi gli occhi.',

function eligible(k,p){

  if(k==='medico')return !(S.opts.noRepeat&&S.lastProtect===p.id);
