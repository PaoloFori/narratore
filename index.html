    var et=pub.endTxt||{title:'Fine',sub:'',cls:'vill'};
    out+='<div class="banner '+et.cls+' mt14"><h1 class="big">'+esc(et.title)+'</h1><p>'+esc(et.sub)+'</p></div><ul class="rows">'+pub.players.map(function(p){return '<li class="row '+(p.alive?'':'dead')+'"><span class="nm">'+esc(p.name)+(p.id===PL.pid?' (tu)':'')+'</span><span class="rx">'+(p.rname?ptag(p.team,p.ico,p.rname):'')+'</span></li>';}).join('')+'</ul>';
    if(pub.log&&pub.log.length){var cur='',h='';pub.log.forEach(function(e){var k=e.ph+e.n;if(k!==cur){cur=k;h+=(h?'</ul>':'')+'<h3>'+(e.ph==='n'?'Notte ':'Giorno ')+e.n+'</h3><ul class="rows log">';}h+='<li><span>'+esc(e.t)+'</span></li>';});out+='<section class="blk"><div class="blkh"><h2>Il racconto</h2></div>'+h+'</ul></section>';}
  }
  return pShell(out,night,theme);
}
function roleCard(c,dead){
  var show=PD.show||dead||false;
  if(!show)return '<button class="rolecard hid" data-a="pToggle" aria-expanded="false">'+ico('eye',56).replace('<svg ','<svg class="rb" ')+'<span class="big">Il tuo ruolo</span><span class="nmx">Tocca per vedere. Controlla che nessuno guardi.</span></button>';
  return '<button class="rolecard" data-a="pToggle" aria-expanded="true">'+ico(c.ico,76).replace('<svg ','<svg class="rb" ')+'<span class="big">'+esc(c.rname)+'</span><span>'+esc(c.rdesc)+'</span>'+(c.seen&&c.seen.length?'<span class="nmx">Hai visto chi sono: '+c.seen.map(esc).join(', ')+'.</span>':'')+(c.mates&&c.mates.length?'<span class="nmx">Con te: '+c.mates.map(esc).join(', ')+'</span>':'')+(c.lover?'<span class="nmx">Sei innamorato di '+esc(c.lover)+'.</span>':'')+'<span class="nmx">Tocca per nascondere.</span></button>';
}

/* ---------- Overlay ---------- */
function toggle(opt,label,sub){return '<div class="opt"><div class="ot"><b>'+label+'</b><small>'+sub+'</small></div><label class="sws"><input type="checkbox" data-opt="'+opt+'" '+(S.opts[opt]?'checked':'')+' aria-label="'+esc(label)+'"><span></span></label></div>';}
function renderOv(){
  if(PL.active||!T.ov){$ov.hidden=true;$ov.innerHTML='';return;}
  $ov.hidden=false;var h='';
  if(T.ov==='black'){h='<div class="black" data-a="blackTap">Tocca due volte per riaccendere</div>';}
  else if(T.ov==='rev'){
    var r=T.rev,p=S.players[r.i];
    if(!r.shown)h='<div class="full"><p class="kick">Passa il telefono a</p><h1 class="big">'+esc(p.name)+'</h1><button class="btn pri" data-a="revShow">'+ico('eye')+'Svela il mio ruolo</button></div>';
    else h='<div class="full"><p class="kick">'+esc(p.name)+', tu sei</p>'+ico(ri(p.role),72).replace('<svg ','<svg class="rb" ')+'<h1 class="big">'+esc(rn(p.role))+'</h1><p class="muted">'+esc(rd(p.role))+'</p><button class="btn pri" data-a="revNext">'+(r.i<S.players.length-1?'Nascondi e passa':'Nascondi e chiudi')+'</button></div>';
  }else if(T.ov==='diary'){
    h='<div class="shade" data-a="closeOv"></div><div class="sheet" role="dialog" aria-label="Diario"><div><div class="sheeth"><h2>Diario del Narratore</h2><button class="icn" data-a="closeOv" aria-label="Chiudi">'+ico('x')+'</button></div><p class="hint mb6">Qui ci sono anche i segreti della notte.</p>'+logHtml(true)+'</div></div>';
  }else{
    h='<div class="shade" data-a="closeOv"></div><div class="sheet" role="dialog" aria-label="Menu"><div><div class="sheeth"><h2>Menu</h2><button class="icn" data-a="closeOv" aria-label="Chiudi">'+ico('x')+'</button></div>'
    +'<div class="blkh"><h2>Atmosfera</h2></div>'+skins()
    +'<div class="blkh mt20"><h2>Regole</h2></div><div class="card">'
    +toggle('revealAll','Svela tutto all’alba','Al mattino mostra anche chi ha fatto cosa durante la notte.')
    +toggle('revealDeath','Mostra il ruolo dei morti','Chi muore scopre la carta.')
    +toggle('noRepeat','Niente doppia protezione','Il Medico non può scegliere la stessa persona due notti di fila.')
    +'</div><div class="bar">'+(S.phase!=='home'&&S.phase!=='roles'?'<button class="btn" data-a="diary">'+ico('book')+'Diario</button>':'')
    +'<button class="btn" data-a="hub">'+ico('grid')+'Tutti i giochi</button>'+(T.confirmNew?'<button class="btn bad" data-a="newgameYes">Sì, azzera tutto</button>':'<button class="btn" data-a="newgameAsk">Nuova partita</button>')+'</div></div></div>';
  }
  $ov.innerHTML=h;
}

/* ---------- Render ---------- */
function key(){return PL.active?('P'+(PD.pub?PD.pub.phase+'|'+PD.pub.night:'x')+(PL.code?1:0)+(PL.pid!=null?1:0)):(S.phase+'|'+S.night+'|'+S.step+'|'+S.dayMode+'|'+(S.hunterRes?1:0));}
function render(){
  if(DEAD)return;
  var y=window.scrollY,k=key();
  var theme=PL.active&&PD.pub?PD.pub.theme:S.theme;
  document.documentElement.setAttribute('data-skin',TH[theme]?theme:'classico');
  $app.innerHTML=PL.active?bPlayer():shell();renderOv();
  window.scrollTo(0,T.lastKey===k?y:0);T.lastKey=k;
}
function commit(){save();render();syncRoom();}

/* ---------- Azioni ---------- */
function addName(){
  var inp=document.getElementById('newName'),v=((inp&&inp.value)||T.draft||'').trim();
  if(!v){T.err='Scrivi un nome.';return commit();}
  if(S.players.some(function(p){return p.name.toLowerCase()===v.toLowerCase();})){T.err='Esiste già un giocatore con questo nome.';T.draft=v;return commit();}
  if(S.players.length>=24){T.err='Massimo 24 giocatori.';return commit();}
  S.players.push({id:S.uid++,name:v,role:'civile',alive:true,lover:null,cause:null});T.draft='';T.err='';commit();
  var i=document.getElementById('newName');if(i)i.focus();
}
function joinRoom(){
  var inp=document.getElementById('joinCode'),v=((inp&&inp.value)||PD.codeDraft||'').trim().toUpperCase();
  if(v.length!==4){PD.codeDraft=v;return render();}
  PL.code=v;PL.pid=null;savePL();PD.codeDraft='';PD.show=false;startWatch();render();
}
function resetKeep(extra){var th0=S.theme,o=S.opts,c=S.cfg,names=S.players.map(function(p){return p.name;}),wasRoom=S.room.on,md=S.mode;S=fresh();S.theme=th0;S.opts=o;S.cfg=c;if(extra==='keepPlayers'){names.forEach(function(n){S.players.push({id:S.uid++,name:n,role:'civile',alive:true,lover:null,cause:null});});if(wasRoom){S.room={on:true,code:newCode(),sent:false};}}else{leaveNarrRoom();}if(extra==='keepPlayers')S.mode=md;SYNC.pub='';SYNC.cards={};if(S.room.on){leaveNarrRoom();ensureNarrRoom();}}
function act(a,d){
  switch(a){
    case 'hub':return SERATA.askHome();
    case 'skin':S.theme=d.k;return commit();
    case 'modeSingle':S.mode='single';return commit();
    case 'modeMulti':if(!CAP.db)return;S.mode='multi';setRoom(true);return commit();
    case 'changeMode':S.mode=null;setRoom(false);return commit();
    case 'del':S.players=S.players.filter(function(p){return p.id!==+d.id;});return commit();
    case 'example':['Anna','Bruno','Chiara','Dario','Elena','Franco','Giulia','Luca'].forEach(function(n){S.players.push({id:S.uid++,name:n,role:'civile',alive:true,lover:null,cause:null});});return commit();
    case 'kid':S.nd.kid=+d.k;return commit();
    case 'lp':S.cfg.lupiAuto=false;S.cfg.lupi=Math.min(lupiCount()+1,8);return commit();
    case 'cp':{var cv=civCount();S.cfg.civAuto=false;S.cfg.civili=Math.min(cv+1,24);return commit();}
    case 'cm':{var cw=civCount();S.cfg.civAuto=false;S.cfg.civili=Math.max(cw-1,0);return commit();}
    case 'civAuto':S.cfg.civAuto=true;return commit();
    case 'lm':S.cfg.lupiAuto=false;S.cfg.lupi=Math.max(lupiCount()-1,1);return commit();
    case 'deal':if(problemSetup())return;deal();return commit();
    case 'reshuffle':deal();return commit();
    case 'toHome':S.phase='home';return commit();
    case 'sendCards':if(problemRoles())return;S.room.sent=true;return commit();
    case 'reveal':T.rev={i:0,shown:false};T.ov='rev';return render();
    case 'revShow':T.rev.shown=true;return render();
    case 'revNext':if(T.rev.i<S.players.length-1){T.rev={i:T.rev.i+1,shown:false};}else{T.ov=null;T.rev=null;}return render();
    case 'start':if(problemRoles())return;startGame();return commit();
    case 'pick':{
      var steps=nightSteps(),k=steps[S.step],id=+d.id,i=T.sel.indexOf(id);
      if(k==='massone')return;
      if(k==='cupido'||k==='investigatore'){if(i>-1)T.sel.splice(i,1);else{if(T.sel.length>=2)T.sel.shift();T.sel.push(id);}}
      else T.sel=i>-1?[]:[id];
      return render();}
    case 'prev':if(S.step>0){S.step--;T.selFor='';}return commit();
    case 'next':{
      var st=nightSteps(),kk=st[S.step];
      commitStep(kk,T.sel,stepState(kk));
      if(S.step<st.length-1){S.step++;T.selFor='';return commit();}
      goDay();return commit();}
    case 'black':T.ov='black';T.tap=0;return render();
    case 'blackTap':{var now=Date.now();if(now-T.tap<500){T.ov=null;T.tap=0;}else T.tap=now;return render();}
    case 'dawnNext':advance('day');return commit();
    case 'peek':T.peek=!T.peek;return render();
    case 'voteMode':S.dayMode='vote';T.sel=[];return commit();
    case 'voteCancel':S.dayMode='list';return commit();
    case 'pickVote':T.sel=T.sel[0]===+d.id?[]:[+d.id];return render();
    case 'voteNone':doVote(null);T.sel=[];return commit();
    case 'voteGo':doVote(T.sel[0]);T.sel=[];return commit();
    case 'voteNext':advance('night');return commit();
    case 'hunterGo':shoot(T.sel[0]);T.sel=[];return commit();
    case 'hunterSkip':shoot(null);T.sel=[];return commit();
    case 'hunterNext':advance(S.after);return commit();
    case 'again':resetKeep('keepPlayers');T.ov=null;return commit();
    case 'newgame':resetKeep();T.ov=null;return commit();
    case 'menu':T.ov='menu';T.confirmNew=false;return render();
    case 'closeOv':T.ov=null;T.confirmNew=false;return render();
    case 'diary':T.ov='diary';return render();
    case 'newgameAsk':T.confirmNew=true;return render();
    case 'newgameYes':resetKeep();T.ov=null;T.confirmNew=false;return commit();
    case 'toJoin':PL.active=true;PD.codeDraft='';savePL();if(PL.code)startWatch();return render();
    case 'pBack':PL.active=false;savePL();stopWatch();return render();
    case 'pLeave':PL.code='';PL.pid=null;PL.want=null;PD.show=false;savePL();stopWatch();return render();
    case 'pWho':PL.pid=+d.id;savePL();watchCard();return render();
    case 'pToggle':PD.show=!PD.show;return render();
  }
}
function onClick(e){
  var b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  act(b.getAttribute('data-a'),{id:b.getAttribute('data-id'),k:b.getAttribute('data-k')});
}
$app.addEventListener('click',onClick);$ov.addEventListener('click',onClick);
function onChange(e){
  var t=e.target;
  if(t.hasAttribute('data-role')){var p=P(+t.getAttribute('data-role'));p.role=t.value;return commit();}
  if(t.hasAttribute('data-cfg')){S.cfg[t.getAttribute('data-cfg')]=t.checked;return commit();}
  if(t.hasAttribute('data-opt')){S.opts[t.getAttribute('data-opt')]=t.checked;return commit();}
  
}
$app.addEventListener('change',onChange);$ov.addEventListener('change',onChange);
$app.addEventListener('input',function(e){if(e.target.id==='newName')T.draft=e.target.value;if(e.target.id==='wantName')PD.wantDraft=e.target.value;if(e.target.id==='joinCode'){e.target.value=e.target.value.toUpperCase();PD.codeDraft=e.target.value;}});
$app.addEventListener('submit',function(e){e.preventDefault();var f=e.target.getAttribute('data-form');if(f==='join')joinRoom();else if(f==='want'){var wi=document.getElementById('wantName'),wv=((wi&&wi.value)||PD.wantDraft||'').trim().slice(0,20);if(!wv)return;PL.want=wv;PD.wantDraft='';savePL();pPresence();render();}else addName();});
window.addEventListener('pagehide',save);

/* ---------- Avvio ---------- */
if(S.phase!=='home'&&!S.mode)S.mode=S.room.on?'multi':'single';
if(!CAP.has&&!S.mode)S.mode='single';
render();
if(S.phase==='night')keepAwake();
if(CAP.has){
  Promise.all([window.claude.use('db'),window.claude.use('room')]).then(function(r){
    if(DEAD)return;
    CAP.db=r[0];CAP.room=r[1];CAP.ready=true;
    if(!CAP.db&&S.mode==='multi'&&S.phase==='home')S.mode=null;
    if(PL.active&&PL.code)startWatch();
    if(S.room.on)ensureNarrRoom();
    render();syncRoom();
  }).catch(function(){CAP.ready=true;});
}
function destroy(){DEAD=true;document.removeEventListener('visibilitychange',keepAwake);window.removeEventListener('pagehide',save);try{save();}catch(e){}stopWatch();leaveNarrRoom();try{if(wl){wl.release();wl=null;}}catch(e){}}
return {destroy:destroy};
};
</script>
<script>SERATA.start();</script>

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
